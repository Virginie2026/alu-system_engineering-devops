<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Ceci n'est pas une page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Libre+Franklin:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #6f9bbf;
    --sky-bottom: #cfe0ea;
    --cloud: #f7fafc;
    --canvas: #e9e2d0;
    --ink: #1f2a33;
    --bowler: #20262c;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(var(--sky-top), var(--sky-bottom));
    color: var(--ink);
    font-family: "Libre Franklin", system-ui, sans-serif;
    overflow-x: hidden;
  }

  /* Clouds drawn with plain CSS, in the spirit of Magritte's skies */
  .cloud {
    position: fixed;
    width: 260px; height: 70px;
    background: var(--cloud);
    border-radius: 100px;
    opacity: .9;
    filter: blur(1px);
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: var(--cloud);
    border-radius: 50%;
  }
  .cloud::before { width: 110px; height: 110px; top: -50px; left: 36px; }
  .cloud::after  { width: 80px;  height: 80px;  top: -30px; left: 130px; }
  .c1 { top: 8%;  left: -40px; }
  .c2 { top: 62%; right: -60px; transform: scale(1.3); }
  .c3 { top: 80%; left: 12%; transform: scale(.7); }

  main {
    position: relative;
    z-index: 1;
    width: min(640px, 100%);
    text-align: center;
  }

  /* The "painting": a framed canvas holding a drawing of a page */
  .frame {
    margin: 0 auto;
    padding: 14px;
    width: min(420px, 92%);
    background: #7a5a36;
    border-radius: 4px;
    box-shadow: 0 18px 40px rgba(20, 35, 50, .35);
  }
  .canvas {
    background: var(--canvas);
    padding: 28px 20px 20px;
    border: 3px solid #a98450;
  }
  .sheet {
    display: block;
    width: 62%;
    height: auto;
    margin: 0 auto;
    animation: settle 1.1s ease-out both;
  }
  @keyframes settle {
    from { transform: translateY(-26px) rotate(-5deg); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  /* Handwritten caption, like the one under the original pipe */
  .caption {
    margin: 18px 0 0;
    font-family: "Pinyon Script", "Snell Roundhand", cursive;
    font-size: clamp(2rem, 7vw, 3rem);
    line-height: 1.1;
    color: #3b2f22;
  }

  h1 {
    margin: 36px 0 8px;
    font-size: 1.25rem;
    font-weight: 600;
  }
  p.help {
    margin: 0 auto 28px;
    max-width: 44ch;
    line-height: 1.6;
  }
  a.home {
    display: inline-block;
    padding: 12px 22px;
    background: var(--bowler);
    color: #fff;
    border-radius: 999px;
    font-weight: 600;
    text-decoration: none;
    transition: background .2s ease;
  }
  a.home:hover { background: #3a4651; }
  a.home:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .sheet { animation: none; }
    a.home { transition: none; }
  }
</style>
</head>
<body>
  <div class="cloud c1" aria-hidden="true"></div>
  <div class="cloud c2" aria-hidden="true"></div>
  <div class="cloud c3" aria-hidden="true"></div>

  <main>
    <div class="frame">
      <div class="canvas">
        <!-- A blank sheet of paper with a folded corner and a faint 404 -->
        <svg class="sheet" viewBox="0 0 200 260" role="img" aria-label="A blank sheet of paper">
          <path d="M10 10 H150 L190 50 V250 H10 Z" fill="#fffdf6" stroke="#1f2a33" stroke-width="4" stroke-linejoin="round"/>
          <path d="M150 10 V50 H190" fill="#e4dcc6" stroke="#1f2a33" stroke-width="4" stroke-linejoin="round"/>
          <text x="100" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="64" fill="#1f2a33" fill-opacity=".14">404</text>
        </svg>
        <p class="caption">Ceci n'est pas une page</p>
      </div>
    </div>

    <h1>Error 404: page not found</h1>
    <p class="help">The address you typed doesn't lead to a page on this server. Check the URL for typos, or start again from the home page.</p>
    <a class="home" href="/">Go to the home page</a>
  </main>
</body>
</html>
